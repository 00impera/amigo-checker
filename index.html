<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Amigo Draw</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial;
            padding: 20px;
        }
        .blue {
            color: #0099ff;
            font-weight: bold;
        }
        .yellow {
            color: #ffcc00;
            font-weight: bold;
        }
        button {
            padding: 10px 20px;
            background: #0099ff;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        pre {
            font-size: 22px;
        }
    </style>
</head>
<body>
<h2>Generator AMIGO</h2>
<button id="run" disabled>Se încarcă...</button>
<pre id="output">Se încarcă motorul Python (poate dura 10-30 secunde la prima rulare)...</pre>

<script>
    // Diagnostic: dacă acest mesaj nu dispare in ~30s, interpretorul Python
    // (Pyodide) nu a reusit sa porneasca -> problema de retea/extensie, nu de cod.
    document.addEventListener("py:ready", () => {
        console.log("Pyodide a pornit cu succes.");
    });
</script>

<script type="py">
import random
from pyscript import document

def generate_amigo_draw():
    numbers = list(range(1, 29))
    blue = sorted(random.sample(numbers, 7))
    remaining = [n for n in numbers if n not in blue]
    yellow = sorted(random.sample(remaining, 5))
    return blue, yellow

def amigo_run(event=None):
    blue, yellow = generate_amigo_draw()
    blue_html = " ".join([f"<span class='blue'>{n}</span>" for n in blue])
    yellow_html = " ".join([f"<span class='yellow'>{n}</span>" for n in yellow])
    result = f"Numere albastre (7): {blue_html}\nNumere galbene (5): {yellow_html}"
    document.getElementById("output").innerHTML = result

run_btn = document.getElementById("run")
run_btn.addEventListener("click", amigo_run)
run_btn.disabled = False
run_btn.innerText = "Generează tiraj"
document.getElementById("output").innerText = "Gata. Apasă butonul."
</script>

</body>
</html>
